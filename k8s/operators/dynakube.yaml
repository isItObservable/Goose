# Scoped DynaKube: Kubernetes monitoring + API/ingest routing only.
# NO full-stack OneAgent — we observe the agent via OTLP, not host injection.
#
# ${DT_ENVIRONMENT_URL} is substituted from your .env at apply time
# (scripts/01-install-operators.sh uses envsubst).
apiVersion: dynatrace.com/v1beta3
kind: DynaKube
metadata:
  name: goose-dynakube
  namespace: dynatrace
  annotations:
    feature.dynatrace.com/automatic-kubernetes-api-monitoring: "true"
spec:
  apiUrl: ${DT_ENVIRONMENT_URL}/api
  # Tokens come from the Secret named after this DynaKube (created in the
  # dynatrace-operator install step).
  tokens: goose-dynakube

  # Capabilities — deliberately scoped. No classicFullStack / cloudNativeFullStack.
  activeGate:
    capabilities:
      - kubernetes-monitoring
      - routing
      - dynatrace-api
      - metrics-ingest
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1.5Gi
