# BMAD crew (ACP) — Planner Deployment + Service.
#
# Writes the plan only — no repository writes, so no MCP creds. Sequential in
# the workflow. OTEL_SERVICE_NAME = goose-planner.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goose-planner
  namespace: goose
  labels:
    app.kubernetes.io/name: goose-planner
    app.kubernetes.io/part-of: goose-bmad-crew
    goose.bmad/role: planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goose-planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goose-planner
        app.kubernetes.io/part-of: goose-bmad-crew
        goose.bmad/role: planner
    spec:
      containers:
        - name: goose
          image: ghcr.io/block/goose:1.46.0
          command: ["goose"]
          args: ["acp"]
          ports:
            - name: acp
              containerPort: 4000
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway-collector.goose.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "goose-planner"
            - name: GOOSE_RECIPE
              value: "/recipes/bmad/planner.yaml"
            - name: GOOSE_PROVIDER
              value: "ollama"
            - name: OLLAMA_HOST
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: OLLAMA_BASE_URL }
            - name: GOOSE_MODEL
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: OLLAMA_MODEL }
          volumeMounts:
            - name: goose-config
              mountPath: /root/.config/goose
            - name: recipes
              mountPath: /recipes
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: goose-config
          configMap:
            name: goose-config
        - name: recipes
          configMap:
            name: goose-recipes
---
apiVersion: v1
kind: Service
metadata:
  name: goose-planner
  namespace: goose
  labels:
    app.kubernetes.io/name: goose-planner
    app.kubernetes.io/part-of: goose-bmad-crew
spec:
  selector:
    app.kubernetes.io/name: goose-planner
  ports:
    - name: acp
      port: 4000
      targetPort: acp
