# BMAD crew (ACP) — Conductor Deployment + Service.
#
# One agent per role so each ACP endpoint is addressable in-cluster. The
# Conductor is the ACP *client*: it dispatches the other roles at their Service
# DNS names (passed as ACP_*_URL). Each role sets its OWN OTEL_SERVICE_NAME so
# the per-role spans are distinguishable; the Conductor forwards `traceparent`
# on each dispatch so the whole run is one distributed trace.
#
# All OTLP still goes to the shared gateway collector on 4318 (HTTP only).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goose-conductor
  namespace: goose
  labels:
    app.kubernetes.io/name: goose-conductor
    app.kubernetes.io/part-of: goose-bmad-crew
    goose.bmad/role: conductor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goose-conductor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goose-conductor
        app.kubernetes.io/part-of: goose-bmad-crew
        goose.bmad/role: conductor
    spec:
      containers:
        - name: goose
          image: ghcr.io/block/goose:1.46.0
          # ACP client/agent mode. If the pinned version's ACP surface does not
          # yet expose a network listener, fall back to the in-process crew
          # (recipes/04-bmad-crew.yaml) — see README §7.
          command: ["goose"]
          args: ["acp"]
          ports:
            - name: acp
              containerPort: 4000
          env:
            # --- Native OpenTelemetry -------------------------------------
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway-collector.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "goose-conductor"
            # --- Per-role ACP endpoints the Conductor dispatches to -------
            - name: ACP_RESEARCHER_URL
              value: "http://goose-researcher.goose.svc.cluster.local:4000"
            - name: ACP_PLANNER_URL
              value: "http://goose-planner.goose.svc.cluster.local:4000"
            - name: ACP_EXECUTOR_URL
              value: "http://goose-executor.goose.svc.cluster.local:4000"
            - name: ACP_REVIEWER_URL
              value: "http://goose-reviewer.goose.svc.cluster.local:4000"
            # --- LLM provider (Ollama) -----------------------------------
            - name: GOOSE_PROVIDER
              value: "ollama"
            - name: OLLAMA_HOST
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: OLLAMA_BASE_URL }
            - name: GOOSE_MODEL
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: OLLAMA_MODEL }
          volumeMounts:
            - name: goose-config
              mountPath: /root/.config/goose
            - name: recipes
              mountPath: /recipes
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: goose-config
          configMap:
            name: goose-config
        - name: recipes
          configMap:
            name: goose-recipes
---
apiVersion: v1
kind: Service
metadata:
  name: goose-conductor
  namespace: goose
  labels:
    app.kubernetes.io/name: goose-conductor
    app.kubernetes.io/part-of: goose-bmad-crew
spec:
  selector:
    app.kubernetes.io/name: goose-conductor
  ports:
    - name: acp
      port: 4000
      targetPort: acp
