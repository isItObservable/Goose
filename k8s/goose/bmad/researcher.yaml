# BMAD crew (ACP) — Researcher Deployment + Service.
#
# Read-only role (GitHub + Dynatrace MCP), parallel-safe. Exposes an ACP
# endpoint the Conductor dispatches to. OTEL_SERVICE_NAME = goose-researcher.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goose-researcher
  namespace: goose
  labels:
    app.kubernetes.io/name: goose-researcher
    app.kubernetes.io/part-of: goose-bmad-crew
    goose.bmad/role: researcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goose-researcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goose-researcher
        app.kubernetes.io/part-of: goose-bmad-crew
        goose.bmad/role: researcher
    spec:
      containers:
        - name: goose
          image: ghcr.io/block/goose:1.46.0
          command: ["goose"]
          # Serve this role's recipe over ACP. The exact ACP invocation depends
          # on the pinned Goose version; GOOSE_RECIPE pins the role either way.
          args: ["acp"]
          ports:
            - name: acp
              containerPort: 4000
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway-collector.goose.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "goose-researcher"
            - name: GOOSE_RECIPE
              value: "/recipes/bmad/researcher.yaml"
            - name: GOOSE_PROVIDER
              value: "ollama"
            - name: OLLAMA_HOST
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: OLLAMA_BASE_URL }
            - name: GOOSE_MODEL
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: OLLAMA_MODEL }
            # Read-only MCP creds: GitHub + Dynatrace.
            - name: GITHUB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: GITHUB_TOKEN }
            - name: DT_ENVIRONMENT_URL
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: DT_ENVIRONMENT_URL }
            - name: DT_MCP_TOKEN
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: DT_MCP_TOKEN }
          volumeMounts:
            - name: goose-config
              mountPath: /root/.config/goose
            - name: recipes
              mountPath: /recipes
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: goose-config
          configMap:
            name: goose-config
        - name: recipes
          configMap:
            name: goose-recipes
---
apiVersion: v1
kind: Service
metadata:
  name: goose-researcher
  namespace: goose
  labels:
    app.kubernetes.io/name: goose-researcher
    app.kubernetes.io/part-of: goose-bmad-crew
spec:
  selector:
    app.kubernetes.io/name: goose-researcher
  ports:
    - name: acp
      port: 4000
      targetPort: acp
