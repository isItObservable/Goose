# Goose deployment.
#
# Two run modes are documented below; the manifest ships the long-lived
# server/agent mode so telemetry is continuous. For batch/scheduled runs, swap
# the command for the headless recipe form (commented) or use a Job.
#
# The OTEL_* env block is what turns on native OpenTelemetry (see
# docs/observability.md). It points at the gateway collector on 4318.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goose
  namespace: goose
  labels:
    app.kubernetes.io/name: goose
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goose
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goose
    spec:
      containers:
        - name: goose
          # Pin to a known-good version (telemetry verified on v1.46.0).
          image: ghcr.io/block/goose:1.46.0
          # --- Run mode -----------------------------------------------------
          # Server/agent mode (long-lived) — default:
          command: ["goose"]
          args: ["agent"]
          # Headless recipe mode (batch) — use a Job instead, e.g.:
          #   args: ["run", "--recipe", "/recipes/01-simple-agent.yaml",
          #          "--params", "topic=OpenTelemetry"]
          env:
            # --- Native OpenTelemetry (the whole point) -------------------
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway-collector.goose.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "goose"
            # --- LLM provider (Ollama) -----------------------------------
            - name: GOOSE_PROVIDER
              value: "ollama"
            - name: OLLAMA_HOST
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: OLLAMA_BASE_URL }
            - name: GOOSE_MODEL
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: OLLAMA_MODEL }
            # --- MCP credentials (used once extensions are enabled) ------
            - name: GITHUB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: GITHUB_TOKEN }
            - name: DT_ENVIRONMENT_URL
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: DT_ENVIRONMENT_URL }
            - name: DT_MCP_TOKEN
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: DT_MCP_TOKEN }
          volumeMounts:
            - name: goose-config
              mountPath: /root/.config/goose
            - name: recipes
              mountPath: /recipes
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: goose-config
          configMap:
            name: goose-config
        - name: recipes
          configMap:
            name: goose-recipes
