# Example Secrets — DO NOT COMMIT REAL VALUES.
#
# Two Secrets are needed:
#   - goose-secrets : consumed by the Goose pod (Ollama + MCP creds)
#   - goose-otel    : consumed by both collectors (Dynatrace URL + ingest token)
#
# The deploy scripts create these from your .env with `kubectl create secret`
# (values never touch git). This file documents the expected keys. Copy to
# secret.yaml (git-ignored) only if you prefer applying manifests directly, and
# fill in base64-encoded values.
apiVersion: v1
kind: Secret
metadata:
  name: goose-secrets
  namespace: goose
type: Opaque
  stringData:
  OLLAMA_BASE_URL: "http://your-ollama-host:11434"
  OLLAMA_MODEL: "qwen3.6"
  GITHUB_TOKEN: "ghp_CHANGE_ME"
  DT_ENVIRONMENT_URL: "https://YOUR_TENANT.live.dynatrace.com"
  DT_MCP_TOKEN: "dt0c01.CHANGE_ME"
  GOOSE_SERVER_SECRET_KEY: "CHANGE_ME_long_random_value"
---
apiVersion: v1
kind: Secret
metadata:
  name: goose-otel
  namespace: goose
type: Opaque
stringData:
  DT_ENVIRONMENT_URL: "https://YOUR_TENANT.live.dynatrace.com"
  DT_INGEST_TOKEN: "dt0c01.CHANGE_ME"
