# Logs collector — DaemonSet — node-level pod logs.
#
# One collector per node tails pod logs with the filelog receiver, enriches with
# Kubernetes attributes, and forwards to Dynatrace over OTLP/HTTP.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-logs
  namespace: goose
spec:
  mode: daemonset              # exactly one log tailer per node
  image: otel/opentelemetry-collector-contrib:latest
  env:
    - name: DT_ENVIRONMENT_URL
      valueFrom:
        secretKeyRef: { name: goose-otel, key: DT_ENVIRONMENT_URL }
    - name: DT_INGEST_TOKEN
      valueFrom:
        secretKeyRef: { name: goose-otel, key: DT_INGEST_TOKEN }
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef: { fieldPath: spec.nodeName }
  # Mount the host log dirs so filelog can read pod logs.
  volumes:
    - name: varlogpods
      hostPath: { path: /var/log/pods }
    - name: varlibdockercontainers
      hostPath: { path: /var/lib/docker/containers }
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true
  config:
    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        include_file_path: true
        operators:
          - type: container    # parses CRI/containerd/docker log formats
            add_metadata_from_filepath: true

    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.node.name
      resourcedetection:
        detectors: [env, system]
      batch:
        send_batch_size: 1000
        timeout: 10s

    exporters:
      otlphttp/dynatrace:
        endpoint: ${env:DT_ENVIRONMENT_URL}/api/v2/otlp
        headers:
          Authorization: "Api-Token ${env:DT_INGEST_TOKEN}"

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes, resourcedetection, batch]
          exporters: [otlphttp/dynatrace]
