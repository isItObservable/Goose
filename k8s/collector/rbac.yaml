# RBAC for the logs DaemonSet's k8sattributes processor.
#
# The OpenTelemetry Operator creates a ServiceAccount named "<collector>-collector"
# (here: otel-logs-collector) in the collector's namespace. k8sattributes needs
# cluster-wide read on pods/namespaces/nodes to enrich log records.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-logs-k8sattributes
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, replicationcontrollers]
    verbs: [get, watch, list]
  - apiGroups: [apps]
    resources: [replicasets, deployments, daemonsets, statefulsets]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-logs-k8sattributes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-logs-k8sattributes
subjects:
  - kind: ServiceAccount
    name: otel-logs-collector
    namespace: goose
