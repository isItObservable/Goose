# goosetown chat UI -> BMAD crew, no-rebuild overlay (ISI-5127 / ISI-5151).
#
# Makes the chat box at svc goosetown-ui :4251 (-> goose-chat container :4250)
# drive the BMAD crew instead of a bare single-agent goose. Pairs with
# bmad-subrecipes-configmap.yaml + the updated 04-bmad-crew.yaml in goosetown-recipes.
# Apply + patch (no image rebuild; cluster pulls the internal registry which lacks
# the new image):
#   kubectl -n goosetown apply -f k8s/goosetown/chat-ui-configmap.yaml \
#     -f k8s/goosetown/bmad-subrecipes-configmap.yaml
#   kubectl -n goosetown patch deploy goosetown --type=strategic -p '{"spec":{"template":{"spec":{
#     "volumes":[{"name":"chat-ui","configMap":{"name":"goosetown-chat-ui"}},
#                {"name":"bmad-subrecipes","configMap":{"name":"goosetown-bmad-subrecipes"}}],
#     "containers":[
#       {"name":"goose-chat","volumeMounts":[
#         {"name":"chat-ui","mountPath":"/opt/chat-ui/chat_server.py","subPath":"chat_server.py"},
#         {"name":"recipes","mountPath":"/recipes/04-bmad-crew.yaml","subPath":"04-bmad-crew.yaml"},
#         {"name":"bmad-subrecipes","mountPath":"/recipes/bmad"}]},
#       {"name":"goosetown","volumeMounts":[{"name":"bmad-subrecipes","mountPath":"/recipes/bmad"}]}]}}}}'
#   kubectl -n goosetown rollout restart deploy/goosetown
---
apiVersion: v1
data:
  chat_server.py: "\"\"\"Web chat UI for the Goose Town BMAD crew.\n\nServes a chat
    page and a POST /api/chat endpoint. Each message the board types is\ntreated as
    a *crew goal*: the server runs the BMAD crew recipe\n(recipes/04-bmad-crew.yaml)
    with `--params goal=<message>`, which spawns the five\nBMAD delegates (analyst
    -> pm -> architect -> dev -> qa) as their own goose\nsubagent sessions. They broadcast
    on the shared Town Wall and light up the\nGoose Town map.\n\nGuardrail: the crew
    recipe is READ-ONLY (every delegate's GitHub MCP runs with\n--read-only and the
    Developer delegate plans but never writes), and this server\nalso exports GITHUB_READ_ONLY=1
    as defence-in-depth, so a board prompt can never\ntrigger an unintended GitHub
    write.\n\nThe final reply is captured from stdout; the goose wrapper's telepathy/wall
    lines\ngo to stderr and are ignored.\n\"\"\"\nimport json\nimport os\nimport re\nimport
    subprocess\nfrom datetime import datetime\n\nfrom starlette.applications import
    Starlette\nfrom starlette.responses import HTMLResponse, JSONResponse\nfrom starlette.routing
    import Route\n\nWALL_FILE = os.environ.get(\"GOOSE_GTWALL_FILE\", os.path.expanduser(\"~/.goosetown/walls/wall.log\"))\n#
    The crew recipe each chat goal drives. Overridable for testing.\nCREW_RECIPE =
    os.environ.get(\"GOOSE_CHAT_RECIPE\", \"/recipes/04-bmad-crew.yaml\")\n# A five-delegate
    crew can take a while on the local Ollama; give it room.\nRUN_TIMEOUT = int(os.environ.get(\"GOOSE_CHAT_TIMEOUT\",
    \"1800\"))\n\n\ndef post_to_wall(sender: str, message: str) -> None:\n    \"\"\"Append
    a line to the shared Town Wall so the goosetown dashboard sees it.\n\n    Wall
    line format is `<HH:MM:SS>|<sender_id>|<message>` (see parse_wall_line\n    in
    goosetown-ui). Single-line message only (no embedded newlines).\n    \"\"\"\n
    \   try:\n        safe_msg = message.replace(\"\\n\", \" \").replace(\"|\", \"\\\\|\")\n
    \       ts = datetime.now().strftime(\"%H:%M:%S\")\n        line = f\"{ts}|{sender}|{safe_msg}\"\n
    \       os.makedirs(os.path.dirname(WALL_FILE), exist_ok=True)\n        with open(WALL_FILE,
    \"a\", encoding=\"utf-8\") as f:\n            f.write(line + \"\\n\")\n    except
    OSError:\n        pass  # wall is best-effort; the chat reply still returns\n\nINDEX_HTML
    = \"\"\"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta
    name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Goose
    Town — BMAD Crew</title>\n<style>\n  :root { --bg:#1A1210; --panel:#2D2118; --accent:#B87333;
    --text:#FFFDD0; }\n  * { box-sizing: border-box; }\n  body { margin:0; font-family:'JetBrains
    Mono',monospace; background:var(--bg); color:var(--text); height:100vh; display:flex;
    flex-direction:column; }\n  header { padding:14px 20px; background:var(--panel);
    color:var(--accent); font-size:20px; }\n  #log { flex:1; overflow-y:auto; padding:20px;
    display:flex; flex-direction:column; gap:12px; }\n  .msg { max-width:72%; padding:10px
    14px; border-radius:10px; white-space:pre-wrap; line-height:1.45; }\n  .user {
    align-self:flex-end; background:#3D2B1F; }\n  .agent { align-self:flex-start;
    background:var(--panel); border:1px solid #4a3424; }\n  .sys  { align-self:center;
    color:#8a7a6a; font-size:12px; }\n  form { display:flex; gap:8px; padding:14px;
    background:var(--panel); }\n  input { flex:1; padding:12px; background:#1A1210;
    border:1px solid #4a3424; color:var(--text); border-radius:8px; font-family:inherit;
    font-size:15px; }\n  button { padding:12px 18px; background:var(--accent); color:#1A1210;
    border:none; border-radius:8px; cursor:pointer; font-weight:bold; }\n  button:disabled
    { opacity:.5; cursor:default; }\n  .spinner { align-self:flex-start; color:#8a7a6a;
    }\n</style>\n</head>\n<body>\n<header>\U0001F986 Goose Town — BMAD Crew &nbsp;<span
    style=\"font-size:12px;color:#8a7a6a\">type a goal → watch the geese move on the
    map</span></header>\n<div id=\"log\"></div>\n<form id=\"f\">\n  <input id=\"i\"
    autocomplete=\"off\" placeholder=\"Give the crew a goal, e.g. “Add a /healthz
    endpoint to the sample service”…\" />\n  <button id=\"b\" type=\"submit\">Run
    crew</button>\n</form>\n<script>\nconst log = document.getElementById('log');\nconst
    input = document.getElementById('i');\nconst btn = document.getElementById('b');\nlet
    session = null;\n\nfunction add(cls, text) {\n  const d = document.createElement('div');\n
    \ d.className = 'msg ' + cls;\n  d.textContent = text;\n  log.appendChild(d);\n
    \ log.scrollTop = log.scrollHeight;\n}\n\nasync function send() {\n  const text
    = input.value.trim();\n  if (!text) return;\n  input.value = '';\n  add('user',
    text);\n  const sp = document.createElement('div');\n  sp.className = 'msg spinner';\n
    \ sp.textContent = '…';\n  log.appendChild(sp);\n  btn.disabled = true;\n  try
    {\n    const r = await fetch('/api/chat', {\n      method: 'POST',\n      headers:
    { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ message:
    text, session }),\n    });\n    const j = await r.json();\n    session = j.session;\n
    \   sp.remove();\n    if (j.error) add('sys', '⚠ ' + j.error);\n    else add('agent',
    j.reply || '(no response)');\n  } catch (e) {\n    sp.remove();\n    add('sys',
    '⚠ ' + e);\n  } finally {\n    btn.disabled = false;\n    input.focus();\n  }\n}\ndocument.getElementById('f').addEventListener('submit',
    (e) => { e.preventDefault(); send(); });\n</script>\n</body>\n</html>\n\"\"\"\n\n\ndef
    run_goose(message: str, session: str | None) -> dict:\n    \"\"\"Run the BMAD
    crew for one goal.\n\n    Each chat message is an independent crew goal: we launch
    the conductor recipe\n    (which spawns the five BMAD delegates) as a fresh named
    session so the map\n    shows one conductor + its delegates per run. `session`
    is not resumed — a\n    crew run is one-shot — but we echo it back so the UI can
    label the thread.\n    \"\"\"\n    env = dict(os.environ)\n    # Defence-in-depth
    guardrail: force the GitHub MCP read-only for every\n    # delegate spawned by
    this run (on top of --read-only in the recipes).\n    env[\"GITHUB_READ_ONLY\"]
    = \"1\"\n\n    name = f\"bmad-conductor-{datetime.now().strftime('%H%M%S')}\"\n
    \   cmd = [\n        \"goose\", \"run\", \"--name\", name,\n        \"--recipe\",
    CREW_RECIPE,\n        \"--params\", f\"goal={message}\",\n        \"--quiet\",\n
    \   ]\n    # The human's goal onto the wall first, so the dashboard shows the
    ask.\n    post_to_wall(\"board\", message)\n    try:\n        proc = subprocess.run(\n
    \           cmd, capture_output=True, text=True, timeout=RUN_TIMEOUT, env=env,\n
    \       )\n    except subprocess.TimeoutExpired:\n        return {\"session\":
    name, \"error\": f\"crew run timed out (>{RUN_TIMEOUT}s)\"}\n\n    reply = (proc.stdout
    or \"\").strip()\n    if proc.returncode != 0 and not reply:\n        return {\"session\":
    name, \"error\": (proc.stderr or \"unknown error\").strip()[-500:]}\n\n    # Reflect
    the conductor's summary onto the shared Town Wall.\n    post_to_wall(\"bmad-conductor\",
    reply)\n    return {\"session\": name, \"reply\": reply}\n\n\nasync def chat_page(request):\n
    \   return HTMLResponse(INDEX_HTML)\n\n\nasync def api_chat(request):\n    try:\n
    \       body = await request.json()\n    except Exception:\n        return JSONResponse({\"error\":
    \"invalid JSON\"}, status_code=400)\n    message = (body.get(\"message\") or \"\").strip()\n
    \   session = body.get(\"session\") or None\n    if not message:\n        return
    JSONResponse({\"error\": \"empty message\"}, status_code=400)\n    result = await
    run_in_thread(run_goose, message, session)\n    return JSONResponse(result)\n\n\nasync
    def run_in_thread(fn, *args):\n    import asyncio\n    return await asyncio.to_thread(fn,
    *args)\n\n\napp = Starlette(\n    routes=[\n        Route(\"/\", chat_page),\n
    \       Route(\"/api/chat\", api_chat, methods=[\"POST\"]),\n    ]\n)\n\n\nif
    __name__ == \"__main__\":\n    import argparse\n\n    import uvicorn\n\n    parser
    = argparse.ArgumentParser()\n    parser.add_argument(\"--host\", default=\"0.0.0.0\")\n
    \   parser.add_argument(\"--port\", type=int, default=4250)\n    args = parser.parse_args()\n
    \   uvicorn.run(app, host=args.host, port=args.port, log_level=\"warning\")\n"
kind: ConfigMap
metadata:
  name: goosetown-chat-ui
  namespace: goosetown
