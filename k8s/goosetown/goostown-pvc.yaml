apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: goose-state
  namespace: goosetown
  labels:
    app.kubernetes.io/name: goosetown
spec:
  accessModes:
    - ReadWriteOnce
  # Uncomment and set this only if your cluster has no default StorageClass
  # (check with: kubectl get storageclass).
  # storageClassName: <your-storage-class>
  resources:
    requests:
      storage: 2Gi
