# Goosetown dashboard service — LoadBalancer so the "geese on a map" UI is
# reachable from outside the cluster (mirrors bmad-crew-ui at 10.0.0.220).
apiVersion: v1
kind: Service
metadata:
  name: goosetown-ui
  namespace: goosetown
  labels:
    app.kubernetes.io/name: goosetown
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: goosetown
  ports:
    - name: http
      port: 80
      targetPort: 4242
