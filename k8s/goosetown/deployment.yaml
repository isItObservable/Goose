# Goosetown deployment — the orchestration layer + real-time dashboard UI,
# with the isItObservable recipes & BMAD crew roles baked into the image.
#
# The pod's main process is the goosetown dashboard (goosetown-ui, :4242).
# The orchestrator (goose session / goose run) is launched on demand via exec,
# and emits native OTel through the OTEL_* env below to the shared collector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goosetown
  namespace: goosetown
  labels:
    app.kubernetes.io/name: goosetown
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goosetown
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goosetown
    spec:
      containers:
        - name: goosetown
          image: ghcr.io/isitobservable/goosetown:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4242
              name: http
          env:
            # Native OTel — inherited by any `goose` process exec'd into this pod.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway-collector.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "goose-goosetown"
            # LLM provider (Ollama on the Mac Studio).
            - name: GOOSE_PROVIDER
              value: "ollama"
            - name: GOOSE_MODEL
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: OLLAMA_MODEL }
            - name: OLLAMA_HOST
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: OLLAMA_BASE_URL }
            - name: GOOSETOWN_BIND_HOST
              value: "0.0.0.0"
          readinessProbe:
            httpGet: { path: "/", port: 4242 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
