# Goosetown deployment — the orchestration layer + real-time dashboard UI,
# with the isItObservable recipes & BMAD crew roles baked into the image.
#
# The pod's main process is the goosetown dashboard (goosetown-ui, :4242).
# The orchestrator (goose session / goose run) is launched on demand via exec,
# and emits native OTel through the OTEL_* env below to the shared collector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goosetown
  namespace: goosetown
  labels:
    app.kubernetes.io/name: goosetown
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goosetown
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goosetown
    spec:
      containers:
        - name: goosetown
          # k8squad cluster registry (pulled without a secret). The public
          # ghcr.io/isitobservable/goosetown image is the tutorial's canonical
          # tag once the GHCR package visibility is set to public.
          image: 10.0.0.13/k8squad/goosetown:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4242
              name: http
          env:
            # Native OTel — inherited by any `goose` process exec'd into this pod.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway-collector.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "goose-goosetown"
            # LLM provider (Ollama on the Mac Studio).
            - name: GOOSE_PROVIDER
              value: "ollama"
            - name: GOOSE_MODEL
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: OLLAMA_MODEL }
            - name: OLLAMA_HOST
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: OLLAMA_BASE_URL }
            # GitHub MCP auth (the agent can read/act on repos).
            - name: GITHUB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef: { name: goose-secrets, key: GITHUB_TOKEN }
            - name: GOOSETOWN_BIND_HOST
              value: "0.0.0.0"
          volumeMounts:
            # Recipes are also available as a ConfigMap so they can be updated
            # without rebuilding the image. subPath (not a directory mount) avoids
            # the goose v1.52.0 ELOOP on ConfigMap `..data` symlinks. The bmad/*
            # roles stay baked into the image.
            - name: recipes
              mountPath: /recipes/01-simple-agent.yaml
              subPath: 01-simple-agent.yaml
            - name: recipes
              mountPath: /recipes/02-dynatrace-mcp.yaml
              subPath: 02-dynatrace-mcp.yaml
            - name: recipes
              mountPath: /recipes/03-github-mcp.yaml
              subPath: 03-github-mcp.yaml
            - name: recipes
              mountPath: /recipes/04-bmad-crew.yaml
              subPath: 04-bmad-crew.yaml
            - name: recipes
              mountPath: /recipes/05-pr-review.yaml
              subPath: 05-pr-review.yaml
          readinessProbe:
            httpGet: { path: "/", port: 4242 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: recipes
          configMap:
            name: goosetown-recipes
