# Recipe 04 — the goosetown BMAD crew entrypoint (Town-map crew).
#
# A Conductor coordinates five BMAD delegates — Analyst, PM, Architect, Developer,
# QA — each spawned as its own goose subagent session (via sub_recipes / the
# summon `delegate` tool). Every delegate broadcasts on the shared Town Wall and
# shows up as its own goose on the Goose Town map:
#
#   bmad-analyst   -> Grand Archive      (researcher)
#   bmad-pm        -> The Scriptorium    (writer)
#   bmad-architect -> Steam Forge        (generic)
#   bmad-dev       -> Cog Factory        (worker)
#   bmad-qa        -> Inspector's Tower  (reviewer)
#
#   goose run --recipe /recipes/04-bmad-crew.yaml --params goal="Add a /healthz endpoint"
#
# GUARDRAIL: this crew is READ-ONLY. Every delegate's GitHub MCP runs
# with --read-only, the Developer delegate plans but never writes, and the
# Conductor is told never to perform repository writes. So a goal typed into the
# chat UI can never trigger an unintended GitHub write via the Developer delegate.
# For a write-capable crew, use the ACP crew (recipes/bmad/conductor.yaml +
# k8s/goose/bmad), which is board-run and gives per-role OTEL service names.
#
# OTEL note: sub_recipe delegates run IN-PROCESS, so they share this process's
# OTEL service.name (goose-goosetown). Per-role breakdown on the
# agent-efficiency dashboards is by session/delegate name, not service.name —
# see docs/observability.md Gotcha 5.

version: "1.0.0"
title: "goosetown BMAD crew"
description: "A conductor-led, read-only BMAD crew (analyst -> pm -> architect -> dev -> qa) over the shared Town Wall."

settings:
  goose_provider: "ollama"
  max_turns: 40

extensions:
  - type: builtin
    name: developer

sub_recipes:
  - name: bmad-analyst
    path: "./bmad/analyst.yaml"
    description: "BMAD Analyst — research/findings brief."
  - name: bmad-pm
    path: "./bmad/pm.yaml"
    description: "BMAD Product Manager — scope + acceptance criteria."
  - name: bmad-architect
    path: "./bmad/architect.yaml"
    description: "BMAD Architect — technical design."
  - name: bmad-dev
    path: "./bmad/dev.yaml"
    description: "BMAD Developer — implementation plan (read-only, no writes)."
  - name: bmad-qa
    path: "./bmad/qa.yaml"
    description: "BMAD QA / Test Architect — review verdict."

instructions: |
  You are the Conductor of a goosetown BMAD crew. Coordinate the five BMAD
  delegates in BMAD order by calling their sub_recipe tools, one at a time.
  When you call each delegate you MUST pass two fields:
    - instructions: a clear, specific task description referencing the crew goal
    - params: {"goal": "<full crew goal text>"}
  (The params field is required — without it the sub-recipe will error with
  "Missing required parameters: goal". Always include it verbatim.)

  Delegate order:
    1. bmad-analyst    (analyse  — research the goal)
    2. bmad-pm         (plan     — scope + acceptance criteria)
    3. bmad-architect  (design   — technical approach)
    4. bmad-dev        (implement — a concrete change PLAN; READ-ONLY, no writes)
    5. bmad-qa         (review   — verdict vs the acceptance criteria)

  After each delegate returns, broadcast a one-line summary of its output on the
  Town Wall before starting the next:
    gtwall conductor "▶ <role> done: <one line>"

  Rule of thumb: reads may run in parallel, writes run sequentially — but this
  crew is READ-ONLY, so never perform repository writes yourself and never
  instruct a delegate to write. Stop and summarise the crew's result when QA
  approves, or after two review rounds.

prompt: |
  Crew goal: {{ goal }}

parameters:
  - key: goal
    input_type: string
    requirement: required
    description: "The objective the crew should accomplish."
