name: build-goosetown-image

on:
  push:
    branches: [main, feat/goose-observability-tutorial, feat/goosetown-bmad-crew]
    paths:
      - "Dockerfile"
      - "recipes/**"
      - "config/goosetown/**"
      - ".github/workflows/build-goosetown-image.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires lowercase repository names; github.repository_owner is
      # `isItObservable`, which must be normalized to `isitobservable`.
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY_OWNER,,}/goosetown" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # NOTE: no "make public" step here. The GHCR package stays private (private
      # repo -> private package), and GITHUB_TOKEN cannot change package visibility
      # (that needs a PAT with admin on the package). The k8s cluster pulls the
      # image from the local registry (10.0.0.13/k8squad/goosetown) instead; flip
      # the GHCR package to public via a PAT with `packages` scope when needed.
