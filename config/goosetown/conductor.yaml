# goosetown Conductor — BMAD crew variant.
# Orchestrates the BMAD roles through the goosetown research → plan → execute →
# review loop, broadcasting progress on the shared Town Wall channel.
name: conductor
role: orchestrator
description: >
  Coordinates the BMAD crew — Analyst, Product Manager, Architect, Developer and
  QA (Test Architect) — through an analyse → plan/design → implement → review loop
  and broadcasts progress on the shared channel.
channel:
  name: town-wall
  mode: broadcast
# Ordered flocks. reads_parallel gathers concurrently; writes_sequential changes
# state one step at a time (BMAD: one story / one change at a time).
workflow:
  - flock: analyst
    mode: reads_parallel
  - flock: pm
    mode: writes_sequential
  - flock: architect
    mode: writes_sequential
  - flock: dev
    mode: writes_sequential
  - flock: qa
    mode: reads_parallel
policy:
  max_review_rounds: 2
  stop_on: reviewer_approved
  cross_review: true
