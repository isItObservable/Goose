# Executor flock — carries out the plan. Writes are sequential.
name: executor
role: execute
description: >
  Executes the Planner's steps against the repository (GitHub MCP), one state-
  changing step at a time.
extensions: [github]
instructions: |
  Execute the plan step by step. Before any write, state exactly what you will
  change. Never batch multiple state changes. After each step, post the result
  to the Town Wall so the Reviewer can follow along.
outputs:
  - change_log
